---
# Turn a fresh template clone into a cluster node, one at a time:
#   ansible-playbook playbooks/bootstrap.yml --limit k3s-master
- name: Bootstrap template clone
  hosts: k3s_cluster
  vars:
    # Reach the node through the template's SSH alias until it has its own IP.
    ansible_host: "{{ template_host }}"
    # Every fresh clone answers on the template IP with new host keys.
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  pre_tasks:
    - name: Require a single node (all clones share the template IP)
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: "Use --limit <{{ groups['k3s_cluster'] | join('|') }}>"
      run_once: true
  roles:
    - bootstrap

- name: Check the node is reachable under its own name
  hosts: k3s_cluster
  tasks:
    - name: Assert hostname
      ansible.builtin.assert:
        that: ansible_facts.hostname == inventory_hostname
