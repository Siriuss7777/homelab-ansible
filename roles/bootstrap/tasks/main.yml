---
# A clone shares hostname, machine-id, SSH host keys and IP with the template.
# Give it its own, then reboot onto the node's IP.
- name: Drop the template's /etc/hosts entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ ansible_facts.hostname }}(\s|$)'
    state: absent

- name: Resolve the node name locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    insertafter: '^127\.0\.0\.1\s'
    line: >-
      {{ bootstrap_ip }}
      {{ bootstrap_node ~ '.' ~ ansible_facts.domain if ansible_facts.domain else '' }}
      {{ bootstrap_node }}

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ bootstrap_node }}"

- name: Remove the template's machine-id
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/machine-id
    - /var/lib/dbus/machine-id

- name: Generate a new machine-id
  ansible.builtin.command: systemd-machine-id-setup
  changed_when: true

- name: Find the template's SSH host keys
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: "ssh_host_*"
  register: bootstrap_host_keys

- name: Remove the template's SSH host keys
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ bootstrap_host_keys.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Generate new SSH host keys
  ansible.builtin.command: ssh-keygen -A
  changed_when: true

- name: Set the node's static IP
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    regexp: '^\s*address\s'
    insertafter: '^iface {{ bootstrap_interface }} inet static'
    line: "\taddress {{ bootstrap_ip }}/{{ bootstrap_prefix }}"

- name: Reboot onto the new IP
  ansible.builtin.reboot:
    connect_timeout: 5
    reboot_timeout: 300
