---
# Trust a node's key on first contact, refuse it if it changes later.
ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new

# Pin a release (e.g. "v1.xx.y+k3s1") for reproducible installs; empty = k3s_channel.
k3s_version: ""
k3s_channel: stable
k3s_install_env: >-
  {{ {'INSTALL_K3S_VERSION': k3s_version} if k3s_version
     else {'INSTALL_K3S_CHANNEL': k3s_channel} }}

# The nodes don't have ~/.ssh/config: resolve the master's IP on the controller.
k3s_api_host: >-
  {{ lookup('pipe', 'ssh -G ' ~ groups['k3s_masters'][0])
     | regex_search('^hostname (\S+)$', '\1', multiline=True) | first }}
k3s_api_url: "https://{{ k3s_api_host }}:6443"

# local-path-provisioner data dir; on the worker it is the 1 TB disk mountpoint.
k3s_data_mountpoint: /var/lib/rancher/k3s/storage
