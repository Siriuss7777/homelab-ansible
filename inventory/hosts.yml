---
# Both VMs are still fresh clones of the Proxmox template, so they share the
# template IP (last address of the DHCP pool). Configure them ONE AT A TIME:
#   ansible-playbook playbooks/site.yml --limit k3s-master
# Once a VM has its final IP, update its ansible_host here.
all:
  children:
    k3s_cluster:
      children:
        k3s_masters:
          hosts:
            k3s-master:
              ansible_host: 192.168.0.204
        k3s_workers:
          hosts:
            k3s-worker:
              ansible_host: 192.168.0.204
